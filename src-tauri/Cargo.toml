[package]
name = "abetterfinder"
version = "0.1.0"
description = "A Better Finder - sehr schnelle Dateisuche"
authors = ["you"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "abetterfinder_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ignore = "0.4"
globset = "0.4"
regex = "1"

# Aufloesung gemappter Netzlaufwerke auf ihre UNC-Freigabe sowie Verschieben/
# Kopieren ueber die Windows-Shell (SHFileOperationW).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_NetworkManagement_WNet",
  "Win32_UI_Shell",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

# Die Suche laeuft auch im Dev-Build ueber echte Dateisysteme -> Abhaengigkeiten
# immer optimiert bauen, sonst ist `tauri dev` spuerbar langsamer.
[profile.dev.package."*"]
opt-level = 3
